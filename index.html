<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 11 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <button id="mem1-button">Memory #1</button>
    <button id="mem2-button">Memory #2</button>
    <button id="mem3-button">Memory #3</button>
    <h1>My Top 3 Memories of <span>This Year</span></h1>
    <ol>
      <li>
        <h3 id="mem1">Memory #1</h3>
        <p class="new years eve">More about this memory.</p>
        <img class="thing1" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT1dIS132d-YCvDppncfuTm6-iTaQmkTi5IeQ&s">
      </li>

      <li>
        <h3 id="mem2">Memory #2</h3>
        <p id="halloween">More about this memory.</p>
        <img class="thing2" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTA2Ri15b11VGV487KFuoHk5Ph5mucTHxixJA&s">
      </li>

      <li>
        <h3 id="mem3">Memory #3</h3>
        <p id="the beach">More about this memory.</p>
        <img class="thing3" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS13b_lLm0EMheQHBIjwSrpKHFuAYb7EfFcrQ&s">
      </li>
    </ol>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>

      // exit image 1
      $(".thing1").hide ();
      //news years eve
      $("#mem1-button").click(function (){
      $("#mem1").css("color", "purple");
      $("#mem1").text("nye party with all my friends!!!");
    
      });

      // ======================== Button #2
      $("#mem2-button").click(function () {
        $("#mem2").css("color", "blue");
      });

      // ======================== Button #3
      $("#mem3-button").click(function () {
        $("#mem3").css("color", "green");
        $("#mem3").text("Coding Parties! 🎉");
      });


    </script>
  </body>
</html>
